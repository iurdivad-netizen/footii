name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queued runs supersede each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GITHUB_PAGES=true switches vite's `base` to '/<repo>/' so assets resolve
      # on the project page URL. See vite.config.ts.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # `enablement: true` lets this job turn Pages on (and set its build source
      # to "GitHub Actions") using the pages:write permission granted above.
      # Without it the job fails with "Get Pages site failed ... Not Found" on a
      # repository where Pages has never been configured, or silently keeps a
      # legacy "deploy from a branch" source that would publish the unbuilt
      # repository root instead of dist/.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
