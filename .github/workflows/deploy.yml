name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Run the checks on pull requests too, otherwise a PR gets no CI signal at
  # all and the test suite only ever runs after a change has already landed.
  # The build/deploy jobs below stay off for pull requests.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Scoped per ref so a pull request's checks cannot cancel an in-flight
# deployment of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    # Never publish from a pull request: a PR must not be able to overwrite the
    # live site. Deployment happens only for main (or a manual dispatch).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GITHUB_PAGES=true switches vite's `base` to '/<repo>/' so assets resolve
      # on the project page URL. See vite.config.ts.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # `enablement: true` lets this job turn Pages on (and set its build source
      # to "GitHub Actions") using the pages:write permission granted above.
      # Without it the job fails with "Get Pages site failed ... Not Found" on a
      # repository where Pages has never been configured, or silently keeps a
      # legacy "deploy from a branch" source that would publish the unbuilt
      # repository root instead of dist/.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
